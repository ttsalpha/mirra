<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 11px;
        --mark-ink: #101418;
        --mark-mint: #0fa87c;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --mark-ink: #fff;
          --mark-mint: #49e3b0;
        }
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        min-height: 0;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        color: var(--figma-color-text, #1e1e1e);
        background: var(--figma-color-bg, #fff);
      }
      header {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .mark {
        width: 16px;
        height: 16px;
        flex: none;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #b3b3b3;
        flex: none;
      }
      .dot.online {
        background: #14ae5c;
      }
      .dot.connecting {
        background: #e5a000;
      }
      .dot.offline {
        background: #e03e1a;
      }
      #state {
        font-weight: 600;
      }
      #port {
        margin-left: auto;
        color: var(--figma-color-text-secondary, #777);
        font-variant-numeric: tabular-nums;
      }
      button {
        border: 1px solid var(--figma-color-border, #e6e6e6);
        background: var(--figma-color-bg-secondary, #f5f5f5);
        color: inherit;
        border-radius: 6px;
        padding: 6px 10px;
        font: inherit;
        cursor: pointer;
      }
      button:hover {
        background: var(--figma-color-bg-hover, #ebebeb);
      }
      #log {
        flex: 1 1 auto;
        min-height: 0;
        margin: 0;
        padding: 8px;
        overflow: auto;
        white-space: pre-wrap;
        border-radius: 6px;
        background: var(--figma-color-bg-secondary, #f5f5f5);
        color: var(--figma-color-text-secondary, #777);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 10px;
        line-height: 1.5;
      }
      #exec-row {
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--figma-color-text-secondary, #777);
        cursor: pointer;
      }
      #allow-exec {
        margin: 0;
      }
      footer {
        color: var(--figma-color-text-tertiary, #999);
      }
    </style>
  </head>
  <body>
    <header>
      <svg class="mark" viewBox="0 0 256 256" aria-hidden="true">
        <g fill="none" stroke-width="32" stroke-linejoin="round" stroke-linecap="butt">
          <path d="M48 116V44l80 56 80-56v72" stroke="var(--mark-ink)" />
          <path d="M48 142v72l80-56 80 56v-72" stroke="var(--mark-mint)" />
        </g>
      </svg>
      <span id="dot" class="dot offline"></span>
      <span id="state">Disconnected</span>
      <span id="port">—</span>
    </header>
    <button id="reconnect" type="button">Reconnect</button>
    <label id="exec-row">
      <input id="allow-exec" type="checkbox" />
      Allow code execution
    </label>
    <pre id="log"></pre>
    <footer>Keep this panel open while the agent works.</footer>
    <script>
      /*__MIRRA_UI__*/
    </script>
  </body>
</html>
