<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 11px;
      }
      html,
      body {
        height: 100%;
      }
      body {
        box-sizing: border-box;
        margin: 0;
        min-height: 0;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        color: var(--figma-color-text, #1e1e1e);
        background: var(--figma-color-bg, #fff);
      }
      header {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .mark {
        width: 20px;
        height: 20px;
        flex: none;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #b3b3b3;
        flex: none;
      }
      .dot.online {
        background: #14ae5c;
      }
      .dot.connecting {
        background: #e5a000;
      }
      .dot.offline {
        background: #e03e1a;
      }
      #state {
        font-weight: 600;
      }
      #help {
        margin-left: auto;
        display: flex;
        color: var(--figma-color-text-tertiary, #999);
      }
      #help:hover {
        color: var(--figma-color-text, #1e1e1e);
      }
      #hint {
        margin: 0;
        color: var(--figma-color-text-secondary, #777);
        line-height: 1.5;
      }
      #hint[hidden] {
        display: none;
      }
      #hint strong {
        color: var(--figma-color-text, #1e1e1e);
        font-weight: 600;
      }
      #hint code {
        padding: 1px 4px;
        border-radius: 4px;
        background: var(--figma-color-bg-secondary, #f5f5f5);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 10px;
        white-space: nowrap;
      }
      button {
        border: 1px solid var(--figma-color-border, #e6e6e6);
        background: var(--figma-color-bg-secondary, #f5f5f5);
        color: inherit;
        border-radius: 6px;
        padding: 6px 10px;
        font: inherit;
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        background: var(--figma-color-bg-hover, #ebebeb);
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      #log {
        flex: 1 1 auto;
        min-height: 0;
        margin: 0;
        padding: 8px;
        overflow: auto;
        white-space: pre-wrap;
        border-radius: 6px;
        background: var(--figma-color-bg-secondary, #f5f5f5);
        color: var(--figma-color-text-secondary, #777);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 10px;
        line-height: 1.5;
      }
      #exec-row {
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--figma-color-text-secondary, #777);
        cursor: pointer;
      }
      #allow-exec {
        margin: 0;
      }
      footer {
        color: var(--figma-color-text-tertiary, #999);
      }
    </style>
  </head>
  <body>
    <header>
      <svg class="mark" viewBox="0 0 256 256" aria-hidden="true">
        <rect width="256" height="256" rx="56" fill="#101418" />
        <g
          transform="translate(33 33) scale(0.74)"
          fill="none"
          stroke-width="32"
          stroke-linejoin="round"
          stroke-linecap="butt"
        >
          <path d="M48 116V44l80 56 80-56v72" stroke="#fff" />
          <path d="M48 142v72l80-56 80 56v-72" stroke="#49e3b0" />
        </g>
      </svg>
      <span id="dot" class="dot offline"></span>
      <span id="state">Disconnected</span>
      <a
        id="help"
        href="https://github.com/ttsalpha/mirra#readme"
        target="_blank"
        rel="noopener"
        title="Help"
        aria-label="Help"
      >
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <circle cx="8" cy="8" r="6.25" stroke="currentColor" stroke-width="1.25" />
          <path d="M8 7.25v3.5" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" />
          <circle cx="8" cy="5" r="0.85" fill="currentColor" />
        </svg>
      </a>
    </header>
    <p id="hint">
      <strong>Waiting for the Mirra server.</strong> Open your MCP client, which starts it. First
      time? Run <code>npx @ttsalpha/mirra init</code>.
    </p>
    <button id="reconnect" type="button">Reconnect</button>
    <label id="exec-row">
      <input id="allow-exec" type="checkbox" />
      Allow code execution
    </label>
    <pre id="log"></pre>
    <footer>Keep this panel open while the agent works.</footer>
    <script>
      /*__MIRRA_UI__*/
    </script>
  </body>
</html>
